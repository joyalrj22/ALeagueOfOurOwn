name: CI - Netlify build check

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Run UI build (Netlify equivalent)
        working-directory: ui
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch-and-exec / reverse-shell pattern scan
        run: scripts/ci/check-shell-patterns.sh
