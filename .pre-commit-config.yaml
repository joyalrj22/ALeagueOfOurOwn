# Optional local convenience hooks. CI is the enforcement boundary.
# Install with: pre-commit install --install-hooks && pre-commit install --hook-type pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: check-shell-patterns
        name: Fetch-and-exec / reverse-shell pattern scan
        entry: scripts/ci/check-shell-patterns.sh
        language: system
        # Blocks curl|bash / dig|bash / base64 -d|bash / non-local /dev/tcp
        # primitives an indirect prompt injection could smuggle in. See SECURITY.md.
        types: [text]
        files: \.(sh|bash|py|js|mjs|cjs|ts|cmd)$|(^|/)(Makefile|Dockerfile[^/]*)$
